name: Job Hunt HQ checks
on:
  pull_request:
    paths:
      [
        "web/**",
        "worker-support/**",
        "skills/morning-planner/**",
        "skills/prepare-application/**",
        "supabase/migrations/**",
        "supabase/proposals/**",
        ".github/workflows/web.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "web/**",
        "worker-support/**",
        "skills/morning-planner/**",
        "skills/prepare-application/**",
        "supabase/migrations/**",
        "supabase/proposals/**",
        ".github/workflows/web.yml",
      ]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npx --no-install prettier --check ../worker-support/*
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          HQ_OUTREACH_PROPOSAL: ${{ github.workspace }}/supabase/proposals/outreach/20261001230000_outreach_domain.sql
      - run: npm run build
  intake-extraction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker-support/intake-extraction/requirements.txt
      - run: python -m pip install --requirement worker-support/intake-extraction/requirements.txt
      - run: python -B -m unittest discover -s worker-support/intake-extraction -p 'test_*.py' -v
