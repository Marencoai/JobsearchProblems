name: Job Hunt HQ checks
on:
  pull_request:
    paths: ["web/**", "worker-support/**", "skills/morning-planner/**", "skills/prepare-application/**", "supabase/migrations/**", ".github/workflows/web.yml"]
  push:
    branches: [main]
    paths: ["web/**", "worker-support/**", "skills/morning-planner/**", "skills/prepare-application/**", "supabase/migrations/**", ".github/workflows/web.yml"]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npx --no-install prettier --check ../worker-support/*
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
